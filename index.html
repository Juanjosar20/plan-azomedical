async function __k(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function __dec(b64,pw){const b=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));const k=await __k(pw,b.slice(0,16));return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28)))}
async function open_(pw){const html=new TextDecoder().decode(await __dec(P,pw));try{sessionStorage.setItem('azk',pw)}catch(e){}document.open();document.write(html);document.close()}
(async()=>{let pw=null;const m=location.hash.match(/[#&]k=([^&]+)/);if(m){pw=decodeURIComponent(m[1]);const rest=location.hash.replace(/[#&]?k=[^&]+&?/,'').replace(/^#?/,'');history.replaceState(null,'',location.pathname+(rest?'#'+rest:''))}
